<!doctype html>
<html lang="fr-CA">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Gestionnaire Arhlete — Connexion</title><link rel="stylesheet" href="css/app.css"></head>
<body class="auth-page"><main class="auth-card"><p class="eyebrow">Gestionnaire de boxe</p><h1 id="authTitle">Connexion</h1><p class="muted" id="authIntro">Accède à la liste de tes athlètes.</p><form id="authForm"><label class="field signup-only hidden"><span>Nom du coach</span><input id="fullName" autocomplete="name"></label><label class="field signup-only hidden"><span>Nom du gym</span><input id="gymName" autocomplete="organization"></label><label class="field signup-only hidden"><span>Adresse du gym <small>(facultatif)</small></span><input id="gymAddress" autocomplete="street-address"></label><label class="field"><span>Courriel</span><input id="email" type="email" required autocomplete="email"></label><label class="field"><span>Mot de passe</span><input id="password" type="password" required minlength="6" autocomplete="current-password"></label><p class="form-error hidden" id="authError" role="alert"></p><button class="button button-dark full" id="authSubmit" type="submit">Se connecter</button></form><button class="link-button" id="authToggle" type="button">Créer un compte coach</button><p class="success hidden" id="authSuccess" role="status"></p></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><script src="js/auth.js"></script></body></html>
