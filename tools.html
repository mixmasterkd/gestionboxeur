<!doctype html>
<html lang="fr-CA">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#24272c">
  <meta name="description" content="Timers de boxe et à intervalles, compteur de coups et cadence de pas."><title>Outils d’entraînement</title>
  <link rel="stylesheet" href="css/tools-page.css"><script type="module" src="js/appearance.js"></script>
  <meta name="application-name" content="GBoxeur">
  <meta name="apple-mobile-web-app-title" content="GBoxeur">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" sizes="180x180" href="images/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="images/app-icon-192.png">
</head>
<body class="tools-page">
  <a class="skip-link" href="#main">Aller aux outils</a>
  <header class="topbar"><a class="brand" href="planning.html"><span id="gymBrand">Mon espace</span><span id="gymAddress" class="brand-location"></span></a><nav class="top-actions" aria-label="Mon compte"><span id="accountName"></span><button class="text-button" id="logoutButton" type="button">Déconnexion</button></nav></header>
  <main id="main" class="tools-main" tabindex="-1">
    <p id="toolsLoading" class="muted" role="status">Chargement de tes outils…</p>
    <p id="toolsError" class="form-error" role="alert" hidden></p>
    <div id="toolsApp" hidden>
      <section id="toolDetail" class="tool-detail" aria-labelledby="toolTitle" hidden>
        <header class="tool-toolbar"><h1 id="toolTitle" tabindex="-1"></h1><button id="toolFullscreen" class="button secondary" type="button" aria-pressed="false">Plein écran</button></header>
        <div id="toolStage"></div>
        <p id="toolNotice" class="tool-notice" role="status"></p>
      </section>
    </div>
  </main>
  <script type="module" src="js/tools-page.js"></script>
</body>
</html>
